<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股市信息 Dashboard</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <h1>📈 股市信息 Dashboard</h1>
  <div id="updated" class="muted">加载中…</div>
</header>

<section id="quotes-strip" class="quotes-strip"></section>

<nav id="nav">
  <button class="tab active" data-tab="overview">📊 概览</button>
  <button class="tab" data-tab="news">📰 公司新闻</button>
  <button class="tab" data-tab="feeds">🗞️ 信息流</button>
</nav>

<main>
  <div id="tab-overview" class="tab-panel active">
    <section id="sec-earnings">
      <h2>📅 财报日历 <span class="muted">(过去 7 天 ~ 未来 21 天)</span></h2>
      <div id="earnings-calendar" class="card"></div>
    </section>

    <section id="sec-surprises">
      <h2>💰 最近财报 EPS(实际 vs 预期)</h2>
      <div id="earnings-surprises" class="grid"></div>
    </section>

    <section id="sec-analysts">
      <h2>🎯 分析师评级</h2>
      <div id="recommendations" class="card"></div>
    </section>
  </div>

  <div id="tab-news" class="tab-panel">
    <section id="sec-news">
      <h2>📰 公司新闻 <span class="muted">(近 3 天,来自 Finnhub)</span></h2>
      <div id="news-filters" class="chips"></div>
      <div id="company-news" class="card list"></div>
    </section>
  </div>

  <div id="tab-feeds" class="tab-panel">
    <section id="sec-feeds">
      <h2>🗞️ 信息流 <span class="muted">(新闻源 / 大V / YouTube / 社区)</span></h2>
      <div id="feed-filters" class="chips"></div>
      <div id="feeds" class="card list"></div>
    </section>
  </div>

  <section id="sec-errors">
    <div id="errors" class="muted small"></div>
  </section>
</main>

<footer class="muted small">
  数据来源: Finnhub 免费 API + 公开 RSS · 仅供个人参考,不构成投资建议
</footer>

<script src="assets/app.js"></script>
</body>
</html>
