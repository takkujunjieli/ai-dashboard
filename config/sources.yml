# 信息流来源配置。每个来源三个字段:
#   name:     显示名称
#   category: news(新闻) | kol(大V观点) | youtube(视频) | community(社区)
#   url:      RSS/Atom 地址
#
# 某个源抓取失败不影响其他源,失败信息会显示在 dashboard 底部。

sources:
  # ---------- 新闻网站 ----------
  # - name: CNBC Markets
  #   category: news
  #   url: https://www.cnbc.com/id/100003114/device/rss/rss.html

  - name: MarketWatch Top Stories
    category: news
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories

  # - name: Yahoo Finance
  #   category: news
  #   url: https://finance.yahoo.com/news/rssindex

  # 财报电话会议全文(Seeking Alpha transcripts,若被限流可注释掉)
  - name: Seeking Alpha Transcripts
    category: news
    url: https://seekingalpha.com/sector/transcripts.xml

  # ---------- YouTube 频道 ----------
  # 固定格式: https://www.youtube.com/feeds/videos.xml?channel_id=<频道ID>
  # 找频道ID: 打开频道主页 → 右键查看网页源代码 → 搜索 "channelId"
  # - name: Bloomberg Television
  #   category: youtube
  #   url: https://www.youtube.com/feeds/videos.xml?channel_id=UCIALMKvObZNtJ6AmdCLP7Lg

  # ---------- Reddit ----------
  # 用 .json 端点(而非 .rss)以获取点赞数/评论数,信息流里社区帖按热度排序
  - name: r/stocks 热帖
    category: community
    url: https://www.reddit.com/r/stocks/hot.json?limit=25

  - name: r/wallstreetbets 热帖
    category: community
    url: https://www.reddit.com/r/wallstreetbets/hot.json?limit=25

  # ---------- X / Twitter 大V(官方 API 收费,走 RSSHub 桥接) ----------
  # 公共实例 rsshub.app 可能限流,稳定使用建议自建 RSSHub(免费,可部署在 Vercel)
  # - name: "@某大V"
  #   category: kol
  #   url: https://rsshub.app/twitter/user/某大V用户名

  # ---------- 雪球大V(走 RSSHub) ----------
  # 用户ID在雪球个人主页 URL 里: xueqiu.com/u/<数字ID>
  # - name: 雪球某大V
  #   category: kol
  #   url: https://rsshub.app/xueqiu/user/1234567890
