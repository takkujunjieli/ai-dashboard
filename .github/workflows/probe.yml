name: Flow API 探针
on:
  workflow_dispatch:
    inputs:
      sym:
        description: "探测的股票代码"
        required: false
        default: "AMD"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe_flow_apis.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
          PROBE_SYM: ${{ inputs.sym }}
