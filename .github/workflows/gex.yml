name: 盘中滚动采集
run-name: "盘中滚动采集${{ inputs.once == 'true' && ' (单轮)' || '' }}"

# 交易日自动运行:开盘前启动、按批滚动至收盘;也可从交易台/Actions 手动触发
on:
  schedule:
    - cron: "25 13 * * 1-5"   # UTC 13:25:夏令时开盘前 5 分钟,冬令时提前 65 分钟(脚本会等到 ET 9:30)
  workflow_dispatch:
    inputs:
      once:
        description: "true = 只跑一轮就结束(不限交易时段,测试/补数据用)"
        required: false
        default: "false"
      end:
        description: "结束时间(UTC ISO,留空 = 收盘 ET 16:00)"
        required: false
        default: ""
      batch:
        description: "每批标的数"
        required: false
        default: "3"

permissions:
  contents: write
  actions: write   # 接近 6h 上限时续派接力

# 同一时刻只保留一个采集会话
concurrency:
  group: gex-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # Actions 单 job 上限 6h,留余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 滚动采集会话
        env:
          GH_TOKEN: ${{ github.token }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
          ONCE: ${{ inputs.once || 'false' }}
          END: ${{ inputs.end || '' }}
          BATCH: ${{ inputs.batch || '3' }}
        run: python scripts/collect_session.py
