name: 盘中采集
run-name: "盘中采集 GEX+研究数据 (间隔 ${{ inputs.gap }} 分钟)"

# 由 dashboard「⚡ GEX」分页的控制面板触发(也可在 Actions 页手动填参数)
on:
  workflow_dispatch:
    inputs:
      start:
        description: "开始时间(UTC ISO,如 2026-07-10T13:30:00Z;留空=立即开始)"
        required: false
        default: ""
      end:
        description: "结束时间(UTC ISO;留空=只采集一次)"
        required: false
        default: ""
      gap:
        description: "采集间隔(分钟)"
        required: false
        default: "30"

permissions:
  contents: write
  actions: write   # 接近 6h 上限时自动续跑

# 重复点启动时,新会话替换旧会话
concurrency:
  group: gex-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # Actions 单 job 上限 6h,留余量
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 采集循环
        env:
          GH_TOKEN: ${{ github.token }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          GAP: ${{ inputs.gap }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          now=$(date -u +%s)
          start_s=$now
          [ -n "$START" ] && start_s=$(date -d "$START" +%s)
          end_s=0
          [ -n "$END" ] && end_s=$(date -d "$END" +%s)

          if [ "$start_s" -gt "$now" ]; then
            echo "等待 $(( start_s - now ))s 到开始时间 $START"
            sleep $(( start_s - now ))
          fi

          job_start=$(date -u +%s)
          while :; do
            python scripts/fetch_gex.py
            python scripts/fetch_research.py

            git add data/gex.json data/gex_history.json data/research.json data/oi_prev.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: GEX 快照 $(date -u +%H:%M)"
              # -X theirs: 生成文件与并行运行冲突时用本次的
              git pull --rebase -X theirs origin main || true
              git push || { git pull --rebase -X theirs origin main && git push; }
            fi

            now=$(date -u +%s)
            [ "$end_s" -eq 0 ] && break                       # 未填结束时间,只采集一次
            [ $(( now + GAP * 60 )) -ge "$end_s" ] && break   # 下一轮已超过结束时间

            # 接近 6h 上限(含等待时间共 5h20m)时,续一个 run 接力剩余时段
            if [ $(( now - job_start )) -gt 19200 ]; then
              echo "接近单次运行上限,续跑至 $END"
              gh workflow run gex.yml -R "$GITHUB_REPOSITORY" \
                -f start="" -f end="$END" -f gap="$GAP"
              break
            fi
            sleep $(( GAP * 60 ))
          done
