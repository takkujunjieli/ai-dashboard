name: 13F 探针
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/probe_13f.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
