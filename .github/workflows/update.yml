name: 每日更新数据

on:
  schedule:
    # 收盘后 EOD:全天逐笔精确层 + 基线 + 行情/信息流。21:15 UTC 取"两季都在 16:00 ET 收盘之后"
    # 的固定时刻(冬 ET 16:15 ≈ 收盘后 15min;夏 ET 17:15)。盘前那次已废(9:00 ET 测不到今天)。
    - cron: "15 21 * * *"
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取行情/财报数据 (Finnhub)
        run: python scripts/fetch_market.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      # news/discussion 一天一次(现只剩收盘后一次 cron + 手动触发)
      - name: 抓取 RSS 信息流
        run: python scripts/fetch_feeds.py
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}

      - name: 抓取研究数据(K线/short/期权,EOD 基线)
        run: python scripts/fetch_research.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
          FLOW_PRECISE: "1"   # 收盘后跑逐笔 Lee-Ready 精确层(全天完整 tape,~10min);盘中 12:00 ET 另跑一次(collect_session)

      - name: 提交数据到 main(EOD 基线 + Pages 兜底)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新数据 $(date -u +%F\ %R)"
            # -X theirs: 与并行的盘中采集撞车时,生成的数据文件直接用本次的,避免冲突失败
            git pull --rebase -X theirs origin main
            git push || { git pull --rebase -X theirs origin main && git push; }
          fi

      - name: 镜像数据到 data 分支(前端主数据源)
        run: |
          python scripts/push_data.py data "chore: EOD baseline $(date -u +%F\ %R)"

  # 机器人提交不会触发分支式 Pages 构建,所以在这里直接用工作流部署 Pages
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 取分支最新提交,包含 update 任务刚推送的数据
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
