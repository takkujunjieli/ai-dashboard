name: 每日更新数据

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 美东盘前 (UTC 13:00 ≈ ET 8/9 点)
    - cron: "30 22 * * *"    # 美东盘后 (UTC 22:30 ≈ ET 5:30/6:30 pm)
  workflow_dispatch: {}       # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取行情/财报数据 (Finnhub)
        run: python scripts/fetch_market.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

      - name: 抓取 RSS 信息流
        run: python scripts/fetch_feeds.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: 更新数据 $(date -u +%F\ %R)"
          git push

  # 机器人提交不会触发分支式 Pages 构建,所以在这里直接用工作流部署 Pages
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 取分支最新提交,包含 update 任务刚推送的数据
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
