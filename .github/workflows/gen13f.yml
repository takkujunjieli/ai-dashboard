name: 13F 生成(临时)
on:
  workflow_dispatch: {}
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_13f.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
      - run: echo "===OUTPUT===" && python -c "import json;d=json.load(open('data/holdings13f.json'));print('errors',d['errors']);print('tickers matched:',list(d['tickers'].keys()));[print(s,'->',[(h['filer'],h['period'],h['shares'],h['value']) for h in v['holdings']][:8]) for s,v in d['tickers'].items()]"
