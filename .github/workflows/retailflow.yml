name: Retail flow 引擎
on:
  workflow_dispatch:
    inputs:
      sym:
        description: "标的(逗号分隔;留空=deep 集,注意成本 ~15min/票)"
        required: false
        default: "HOOD,COIN,RKLB"
      day:
        description: "目标日 YYYY-MM-DD(留空=最近工作日)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pytrends

      - name: 逐笔散户流(场外次美分 + 中点签名)
        run: python scripts/fetch_tick_flow.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
          RF_SYMS: ${{ inputs.sym }}
          RF_DAY: ${{ inputs.day }}

      - name: Attention(Google Trends, best-effort)
        run: python scripts/fetch_trends.py || true
        env:
          RF_SYMS: ${{ inputs.sym }}

      - name: 组装 retailflow.json
        run: python scripts/build_retailflow.py

      - name: 提交数据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/retail_flow_raw.json data/retail_trends.json data/retailflow.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: retailflow $(date -u +%F\ %R)"
            git pull --rebase -X theirs origin main
            git push || { git pull --rebase -X theirs origin main && git push; }
          else
            echo "无数据变化"
          fi

  deploy:
    needs: flow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: bash scripts/cache_bust.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
