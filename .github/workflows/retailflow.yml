name: Retail flow 引擎
on:
  workflow_dispatch:
    inputs:
      sym:
        description: "标的(逗号分隔;留空=research 页选取 config/retail_syms.json。~2-15min/票)"
        required: false
        default: ""
      day:
        description: "单个目标日 YYYY-MM-DD(留空=最近收盘工作日)"
        required: false
        default: ""
      backfill:
        description: "回填最近 N 个工作日(0=不回填;断点续跑,可重复触发直到跑满)"
        required: false
        default: "0"
      days:
        description: "显式日期列表 逗号分隔(覆盖 backfill/day)"
        required: false
        default: ""
  schedule:
    - cron: "0 22 * * 1-5"        # 工作日 22:00 UTC(美股收盘后)增量跑当天

permissions:
  contents: write

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests "urllib3<2" pytrends   # urllib3<2:修 pytrends method_whitelist

      - name: 逐笔散户流(场外次美分 + 中点签名)
        timeout-minutes: 300       # 5h 上限;超时被杀后仍走 always() 提交已完成的天
        run: python scripts/fetch_tick_flow.py
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_BASE_URL: ${{ vars.MASSIVE_BASE_URL }}
          RF_SYMS: ${{ inputs.sym }}      # 空=config/retail_syms.json(research 页多选下拉编辑,独立于 D/Q)
          RF_DAY: ${{ inputs.day }}
          RF_BACKFILL: ${{ inputs.backfill || '0' }}
          RF_DAYS: ${{ inputs.days }}

      - name: Attention(Google Trends, best-effort)
        if: always()
        run: python scripts/fetch_trends.py || true
        env:
          RF_SYMS: ${{ inputs.sym || 'HOOD,COIN,RKLB' }}

      - name: 组装 retailflow.json
        if: always()
        run: python scripts/build_retailflow.py

      - name: 提交数据到 main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/retail_flow_raw.json data/retail_trends.json data/retailflow.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: retailflow $(date -u +%F\ %R)"
            git pull --rebase -X theirs origin main
            git push || { git pull --rebase -X theirs origin main && git push; }
          else
            echo "无数据变化"
          fi

  deploy:
    needs: flow
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: bash scripts/cache_bust.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
